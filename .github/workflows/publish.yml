name: Publish

# NuGet publishing is gated, not automatic. Tag pushes do NOT trigger
# this workflow yet — only manual workflow_dispatch runs do, and the
# nuget push + GitHub Release steps are still guarded by the `release`
# input so the pack-only path can be used to verify the artifact
# pipeline without shipping.
#
# First-publish runbook:
#   1) workflow_dispatch with release=false → produces nupkgs as an
#      artifact, no push. Inspect the uploaded `nuget-packages` artifact.
#   2) workflow_dispatch with release=true → pushes to NuGet.org using
#      the NUGET_KEY repo secret.
#
# To switch to tag-driven publishing later:
#   1) add `push: tags: ["v*"]` to `on:` below
#   2) drop the `if: inputs.release == true` guards on the push +
#      release steps (or branch on `github.event_name == 'push'`)
#   3) confirm the NUGET_KEY secret is still configured on the repo
#
# Tagging convention (when enabled): a single `v*` tag ships all three
# packages (Ahjo.Vulkan, Ahjo.Vulkan.Native, Ahjo.Vulkan.Vma.Native) at
# the same version — they're shipped together.
#   git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional MinVer version override (e.g. 0.1.0). Leave blank to use git tag."
        required: false
        type: string
      include_vma:
        description: "Pack Ahjo.Vulkan.Vma.Native (runs the 4-RID native matrix). Defaults to true since all three packages ship together; flip to false for a fast core-only dry-run."
        required: false
        type: boolean
        default: true
      release:
        description: "Push to NuGet.org and create a GitHub Release. Default: pack only."
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Pre-build the VMA native binaries. All three packages ship at the
  # same version (one v* tag), so the default release flow always packs
  # VMA too — workflow_dispatch defaults include_vma to true. Setting it
  # to false skips the 4-RID matrix for a fast core-only pack dry-run.
  build-vma:
    name: Build VMA native (matrix)
    if: inputs.include_vma == true
    uses: ./.github/workflows/build-vma-native.yml

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [build-vma]
    # build-vma is conditional; allow publish to proceed when it was skipped.
    if: always() && (needs.build-vma.result == 'success' || needs.build-vma.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer walks git history to find the nearest tag + commit
          # height, and Source Link embeds commit SHAs into PDBs. Both
          # need the full history, not a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # ---- VMA native artifact aggregation (when shipping VMA) ----
      # Download all per-RID artifacts produced by build-vma-native.yml and
      # stage them at native/vma/build/<rid>/<libname>, which is exactly
      # where Ahjo.Vulkan.Vma.Native.csproj's PackVmaRuntimes target looks.
      - name: Download VMA native artifacts
        if: needs.build-vma.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: vma-native-*
          path: ${{ github.workspace }}/vma-artifacts

      - name: Stage VMA binaries for pack
        if: needs.build-vma.result == 'success'
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            mkdir -p "native/vma/build/${rid}"
            src_dir="${{ github.workspace }}/vma-artifacts/vma-native-${rid}"
            if [ -d "$src_dir" ]; then
              cp -v "$src_dir"/* "native/vma/build/${rid}/"
            fi
          done

      # ---- Core packages (Ahjo.Vulkan + Ahjo.Vulkan.Native) ----
      # Always packed. src/Ahjo.Vulkan references both Ahjo.Vulkan.Native and
      # Ahjo.Vulkan.Vma.Native, so restoring + building the wrapper pulls
      # both transitive projects in. SkipVmaNativeBuild keeps the host-RID
      # cmake invocation off the build path; the per-RID binaries from
      # build-vma-native.yml (when present) are wired in by Pack (VMA) below.
      - name: Restore (core)
        run: dotnet restore src/Ahjo.Vulkan/Ahjo.Vulkan.csproj

      - name: Build (core, Release)
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: >-
          dotnet build src/Ahjo.Vulkan/Ahjo.Vulkan.csproj
          -c Release
          --no-restore
          -p:SkipVmaNativeBuild=true

      - name: Pack (core)
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: |
          dotnet pack src/Ahjo.Vulkan/Ahjo.Vulkan.csproj \
            -c Release \
            --no-build \
            -p:SkipVmaNativeBuild=true \
            -o "${{ github.workspace }}/artifacts"
          dotnet pack src/Ahjo.Vulkan.Native/Ahjo.Vulkan.Native.csproj \
            -c Release \
            --no-build \
            -o "${{ github.workspace }}/artifacts"

      # ---- VMA native package (skipped when include_vma=false) ----
      # Pack with SkipVmaNativeBuild=true: the binaries already exist
      # (downloaded above), don't ask MSBuild to rebuild the host RID.
      # The wrapper used to live in src/Ahjo.Vulkan.Vma but has been merged
      # into Ahjo.Vulkan; only the .Native package ships separately now.
      - name: Pack (VMA native)
        if: needs.build-vma.result == 'success'
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: |
          dotnet pack src/Ahjo.Vulkan.Vma.Native/Ahjo.Vulkan.Vma.Native.csproj \
            -c Release \
            --no-build \
            -p:SkipVmaNativeBuild=true \
            -o "${{ github.workspace }}/artifacts"

      - name: List artifacts
        run: ls -la ${{ github.workspace }}/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*.*nupkg
          if-no-files-found: error

      # Publish steps below are gated behind the `release` input so that
      # ad-hoc workflow_dispatch runs can produce + verify nupkgs without
      # actually shipping anything. Set release=true only when ready to
      # publish.
      - name: Push to NuGet.org
        if: inputs.release == true
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: inputs.release == true && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg
