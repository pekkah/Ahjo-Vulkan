name: Publish

# Triggers and what they ship:
#   push to main          → preview package (MinVer picks the next pre-
#                           release version: 0.0.0-alpha.0.<height> until
#                           the first tag, then 0.x.y-alpha.0.<height>).
#                           Pushed to NuGet.org as a pre-release; consumers
#                           opt in by allowing pre-release in their feed.
#   release published     → stable package. Tag the commit with v0.1.0,
#                           publish a GitHub Release on that tag — MinVer
#                           reads the tag, ships 0.1.0, and the produced
#                           nupkgs are attached back to the release.
#   workflow_dispatch     → manual override. `release=false` packs without
#                           pushing (artifact-only dry-run); `release=true`
#                           pushes. The `version` input forces a specific
#                           MinVer version when needed.
#
# Failed publishes are recoverable: `dotnet nuget push --skip-duplicate`
# is idempotent, and pre-release versions ratchet monotonically with
# commit height so a re-run never collides.
#
# Tagging a release:
#   git tag v0.1.0 && git push origin v0.1.0
#   gh release create v0.1.0 --generate-notes
# (or create the release via the GitHub UI — that's what fires the
# `release: published` event.)

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional MinVer version override (e.g. 0.1.0). Leave blank to use git tag."
        required: false
        type: string
      include_vma:
        description: "Pack Ahjo.Vulkan.Vma.Native (runs the 4-RID native matrix). Defaults to true since all three packages ship together; flip to false for a fast core-only dry-run."
        required: false
        type: boolean
        default: true
      release:
        description: "Push to NuGet.org. Default: pack only (artifact upload, no push)."
        required: false
        type: boolean
        default: false

# One in-flight publish per ref — main pushes serialize against each
# other so two near-simultaneous commits don't race for the same NuGet
# id+version, but each release tag is its own ref and runs in parallel.
# Never cancel in-flight: a half-published nupkg is worse than a slow
# queue.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Pre-build the VMA native binaries. All three packages ship at the
  # same version, so push/release events ALWAYS pack VMA. Only
  # workflow_dispatch can opt out via include_vma=false, intended for
  # quick core-only dry-runs during development.
  build-vma:
    name: Build VMA native (matrix)
    if: github.event_name != 'workflow_dispatch' || inputs.include_vma == true
    uses: ./.github/workflows/build-vma-native.yml

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [build-vma]
    # build-vma is conditional; allow publish to proceed when it was skipped.
    if: always() && (needs.build-vma.result == 'success' || needs.build-vma.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer walks git history to find the nearest tag + commit
          # height, and Source Link embeds commit SHAs into PDBs. Both
          # need the full history, not a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # ---- VMA native artifact aggregation (when shipping VMA) ----
      # Download all per-RID artifacts produced by build-vma-native.yml and
      # stage them at native/vma/build/<rid>/<libname>, which is exactly
      # where Ahjo.Vulkan.Vma.Native.csproj's PackVmaRuntimes target looks.
      - name: Download VMA native artifacts
        if: needs.build-vma.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: vma-native-*
          path: ${{ github.workspace }}/vma-artifacts

      - name: Stage VMA binaries for pack
        if: needs.build-vma.result == 'success'
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            mkdir -p "native/vma/build/${rid}"
            src_dir="${{ github.workspace }}/vma-artifacts/vma-native-${rid}"
            if [ -d "$src_dir" ]; then
              cp -v "$src_dir"/* "native/vma/build/${rid}/"
            fi
          done

      # ---- Core packages (Ahjo.Vulkan + Ahjo.Vulkan.Native) ----
      # Always packed. src/Ahjo.Vulkan references both Ahjo.Vulkan.Native and
      # Ahjo.Vulkan.Vma.Native, so restoring + building the wrapper pulls
      # both transitive projects in. SkipVmaNativeBuild keeps the host-RID
      # cmake invocation off the build path; the per-RID binaries from
      # build-vma-native.yml (when present) are wired in by Pack (VMA) below.
      - name: Restore (core)
        run: dotnet restore src/Ahjo.Vulkan/Ahjo.Vulkan.csproj

      - name: Build (core, Release)
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: >-
          dotnet build src/Ahjo.Vulkan/Ahjo.Vulkan.csproj
          -c Release
          --no-restore
          -p:SkipVmaNativeBuild=true

      - name: Pack (core)
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: |
          dotnet pack src/Ahjo.Vulkan/Ahjo.Vulkan.csproj \
            -c Release \
            --no-build \
            -p:SkipVmaNativeBuild=true \
            -o "${{ github.workspace }}/artifacts"
          dotnet pack src/Ahjo.Vulkan.Native/Ahjo.Vulkan.Native.csproj \
            -c Release \
            --no-build \
            -o "${{ github.workspace }}/artifacts"

      # ---- VMA native package (skipped when include_vma=false) ----
      # Pack with SkipVmaNativeBuild=true: the binaries already exist
      # (downloaded above), don't ask MSBuild to rebuild the host RID.
      # The wrapper used to live in src/Ahjo.Vulkan.Vma but has been merged
      # into Ahjo.Vulkan; only the .Native package ships separately now.
      - name: Pack (VMA native)
        if: needs.build-vma.result == 'success'
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: |
          dotnet pack src/Ahjo.Vulkan.Vma.Native/Ahjo.Vulkan.Vma.Native.csproj \
            -c Release \
            --no-build \
            -p:SkipVmaNativeBuild=true \
            -o "${{ github.workspace }}/artifacts"

      - name: List artifacts
        run: ls -la ${{ github.workspace }}/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*.*nupkg
          if-no-files-found: error

      # Push for push:main and release:published events always; for
      # workflow_dispatch only when release=true (lets the manual path
      # do artifact-only dry-runs). `--skip-duplicate` keeps re-runs
      # idempotent against an already-published version.
      # `dotnet nuget push *.nupkg` also pushes matching .snupkg files
      # in the same directory automatically.
      - name: Push to NuGet.org
        if: github.event_name != 'workflow_dispatch' || inputs.release == true
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Attach the built nupkgs/snupkgs to the GitHub Release that
      # triggered this run. The Release object already exists (creating
      # it is what fired `release: published`); softprops/action-gh-release
      # updates the existing release's asset list when tag_name matches.
      # Skipped for push:main (no release object) and workflow_dispatch
      # (no associated tag).
      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg
