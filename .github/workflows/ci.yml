name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 for JavaScript actions now so we don't inherit the
# default flip scheduled for 2026-06-02. Remove once all pinned actions
# natively ship with a Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux runners have no GPU. Install Mesa's lavapipe software Vulkan
      # ICD plus the loader and validation layers so VkCreateInstance can
      # resolve and tests can hit a real implementation.
      - name: Install Linux Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          vulkaninfo --summary | head -40 || true

      # Windows runners have a working vulkan-1.dll via the GPU driver; no
      # extra install needed for the loader. (Validation layers ship with
      # the Vulkan SDK — install on demand via setup-vulkan-sdk if a
      # validation-dependent test job is added later.)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Cache the downloaded Vulkan-Headers archive so subsequent runs
      # don't hit GitHub. Invalidates when Directory.Build.props changes —
      # where VulkanHeadersVersion lives.
      - name: Cache Vulkan-Headers
        uses: actions/cache@v4
        with:
          path: native/downloaded
          key: vulkan-headers-${{ matrix.os }}-${{ hashFiles('Directory.Build.props') }}

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build Ahjo.Vulkan.slnx -c Release --nologo

      - name: Test — Ahjo.Vulkan.Native.Tests
        run: dotnet test tests/Ahjo.Vulkan.Native.Tests/Ahjo.Vulkan.Native.Tests.csproj -c Release --no-build --nologo

      - name: Test — Ahjo.Vulkan.Tests
        run: dotnet test tests/Ahjo.Vulkan.Tests/Ahjo.Vulkan.Tests.csproj -c Release --no-build --nologo
