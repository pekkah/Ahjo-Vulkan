name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 for JavaScript actions now so we don't inherit the
# default flip scheduled for 2026-06-02. Remove once all pinned actions
# natively ship with a Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # SwiftShader software Vulkan ICD packaged by Silk.NET (Apache-2.0).
  # Hosted Windows runners ship no Vulkan loader / ICD, so the workflow
  # provisions both alongside the build. Linux CI is parked until a
  # self-hosted runner with real Vulkan drivers is available — issue 32
  # established that SwiftShader on Linux SIGSEGVs mid-suite across
  # every build + loader combination tested.
  SILK_VULKAN_SWIFTSHADER_VERSION: "2025.9.8"
  # Khronos Vulkan loader (vulkan-1.dll) packaged by Silk.NET. Provisioned
  # alongside the ICD; VK_DRIVER_FILES then routes the loader's driver
  # lookup exclusively at SwiftShader.
  SILK_VULKAN_LOADER_VERSION: "2025.9.12"

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Cache the downloaded Vulkan-Headers archive so subsequent runs
      # don't hit GitHub. Invalidates when Directory.Build.props changes —
      # where VulkanHeadersVersion lives.
      - name: Cache Vulkan-Headers
        uses: actions/cache@v4
        with:
          path: native/downloaded
          key: vulkan-headers-windows-latest-${{ hashFiles('Directory.Build.props') }}

      # ── Vulkan loader + SwiftShader ICD ──────────────────────────────
      # Cache hit skips two ~15 MB nupkg downloads. Cache key invalidates
      # whenever either pinned version env var changes.
      - name: Cache Vulkan ICD bundle
        id: cache-vk
        uses: actions/cache@v4
        with:
          path: build/vulkan/win-x64
          key: vk-win-x64-loader${{ env.SILK_VULKAN_LOADER_VERSION }}-sws${{ env.SILK_VULKAN_SWIFTSHADER_VERSION }}

      - name: Provision Khronos loader + SwiftShader ICD
        if: steps.cache-vk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dst = "build/vulkan/win-x64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # .nupkg files are zips; rename to .zip so Expand-Archive
          # accepts them without extension-sniffing complaints.
          $loaderZip = Join-Path $env:RUNNER_TEMP "vk-loader.zip"
          $swsZip    = Join-Path $env:RUNNER_TEMP "vk-sws.zip"
          $loaderUnp = Join-Path $env:RUNNER_TEMP "vk-loader"
          $swsUnp    = Join-Path $env:RUNNER_TEMP "vk-sws"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.nuget.org/api/v2/package/Silk.NET.Vulkan.Loader.Native/${{ env.SILK_VULKAN_LOADER_VERSION }}" `
            -OutFile $loaderZip
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.nuget.org/api/v2/package/Silk.NET.Vulkan.SwiftShader.Native/${{ env.SILK_VULKAN_SWIFTSHADER_VERSION }}" `
            -OutFile $swsZip
          if (Test-Path $loaderUnp) { Remove-Item -Recurse -Force $loaderUnp }
          if (Test-Path $swsUnp)    { Remove-Item -Recurse -Force $swsUnp }
          Expand-Archive -Path $loaderZip -DestinationPath $loaderUnp -Force
          Expand-Archive -Path $swsZip    -DestinationPath $swsUnp    -Force
          Copy-Item -Path "$loaderUnp/runtimes/win-x64/native/*" -Destination $dst -Force
          Copy-Item -Path "$swsUnp/runtimes/win-x64/native/*"    -Destination $dst -Force
          Get-ChildItem $dst | ForEach-Object { Write-Host ("  {0,12}  {1}" -f $_.Length, $_.Name) }

      - name: Configure Vulkan environment
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "build/vulkan/win-x64"
          $icd = Join-Path $dir "vk_swiftshader_icd.json"
          if (-not (Test-Path $icd)) { throw "SwiftShader ICD manifest missing: $icd" }
          # VK_DRIVER_FILES (loader 1.3.207+) overrides system ICD
          # discovery and routes exclusively at SwiftShader.
          "VK_DRIVER_FILES=$icd" >> $env:GITHUB_ENV
          # Prepend so LoadLibrary("vulkan-1.dll") finds the Silk.NET
          # loader before anything system-wide.
          "PATH=$dir;$env:PATH" >> $env:GITHUB_ENV

      # ── /Vulkan loader + SwiftShader ICD ─────────────────────────────

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build Ahjo.Vulkan.slnx -c Release --nologo

      - name: Test — Ahjo.Vulkan.Native.Tests
        run: dotnet test tests/Ahjo.Vulkan.Native.Tests/Ahjo.Vulkan.Native.Tests.csproj -c Release --no-build --nologo -l "console;verbosity=detailed"

      # Detailed console logging prints each test name as it starts so a
      # native crash (SIGSEGV/AV) names the offending test in the log
      # instead of just surfacing as exit 139 with no context. --blame
      # also writes Sequence.xml naming the test that was running when
      # the test host crashed — printed below on step failure.
      - name: Test — Ahjo.Vulkan.Tests
        run: dotnet test tests/Ahjo.Vulkan.Tests/Ahjo.Vulkan.Tests.csproj -c Release --no-build --nologo -l "console;verbosity=detailed" --blame --blame-crash --results-directory TestResults

      - name: Print blame logs on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::Blame Sequence files"
          find TestResults -type f \( -name 'Sequence_*.xml' -o -name '*.txt' -o -name '*.dmp.txt' \) -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"

      # Issue 28 — Native AOT smoke. Publishing under PublishAot=true
      # is the load-bearing check: trim warnings + ILC errors fail the
      # build, so any reflection / dynamic-codegen creep in the wrapper
      # is caught here. With SwiftShader provisioned the published exe
      # also runs the full render→PNG round-trip, exercising the whole
      # wrapper surface under AOT codegen.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: AOT publish — AotSmoke
        run: dotnet publish samples/AotSmoke/AotSmoke.csproj -c Release -r win-x64 --nologo -p:IlcUseEnvironmentalTools=true

      - name: AOT smoke run
        shell: pwsh
        run: |
          $exe = "samples/AotSmoke/bin/x64/Release/net10.0/win-x64/publish/AotSmoke.exe"
          if (-not (Test-Path $exe)) { throw "AOT smoke binary missing: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "AOT smoke exited with code $LASTEXITCODE" }

  # Issue #144 — Ahjo.Vulkan.Vma.Native ships Linux libvma.so binaries that no
  # lane ever executed, so a Release build silently producing a library that
  # SIGSEGVs on the first vmaCreateAllocator reached NuGet as 0.2.0 and broke
  # a downstream consumer. This lane compiles the .so from source on Linux and
  # runs a real allocator + buffer allocation against Mesa's lavapipe.
  #
  # Both Linux RIDs run: the #144 branch (VMA's aligned_alloc stub) is selected
  # by glibc's _GLIBCXX_HAVE_ALIGNED_ALLOC, which is defined on x64 and arm64
  # alike, so arm64 shipped the same fatal binary and deserves the same proof
  # rather than an inference from the x64 result.
  #
  # Deliberately narrow, and NOT a revival of the Linux test matrix: issue 32
  # parked that because software rasterizers SIGSEGV mid-suite on the
  # rendering paths (vkQueueSubmit2, image views). Allocation-only work is
  # both what lavapipe handles reliably and what actually broke here, so this
  # runs Ahjo.Vulkan.Vma.Native.Tests and nothing else. It is a build-artifact
  # check, not driver-gated wrapper coverage — the honesty argument that
  # closed issue 32 still stands for everything else.
  vma-linux:
    name: VMA native smoke (${{ matrix.rid }}, lavapipe)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Don't let one arch's failure hide the other's result — the whole point
      # is knowing which RIDs are actually proven.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
          - rid: linux-arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Mirrors the Windows job's header cache. Covers both the Vulkan-Headers
      # archive and the VMA tarball the cmake build compiles against; both
      # versions are pinned in Directory.Build.props, so that's the key.
      - name: Cache Vulkan + VMA headers
        uses: actions/cache@v4
        with:
          path: |
            native/downloaded
            native/vma/downloaded
          key: vk-vma-headers-${{ matrix.rid }}-${{ hashFiles('Directory.Build.props') }}

      # mesa-vulkan-drivers carries lavapipe (llvmpipe), the CPU ICD; libvulkan1
      # is the Khronos loader. Both come from the distro, so unlike the Windows
      # job there's no nupkg to unpack. Resolve the manifest by glob rather than
      # hardcoding — Debian arch-qualifies the filename (lvp_icd.x86_64.json).
      - name: Provision Mesa lavapipe ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using ICD: $icd"
          # VK_DRIVER_FILES (loader 1.3.207+) pins driver discovery to lavapipe
          # so the lane can't quietly pick up some other ICD on the image.
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      # AHJO_REQUIRE_VULKAN_DEVICE turns VmaSmokeTests' driverless skip into a
      # hard failure. Without it a broken ICD install would report green while
      # executing none of the native code this lane exists to exercise — the
      # exact silent-coverage failure that let #144 ship.
      - name: Test — Ahjo.Vulkan.Vma.Native.Tests
        env:
          AHJO_REQUIRE_VULKAN_DEVICE: "1"
        run: dotnet test tests/Ahjo.Vulkan.Vma.Native.Tests/Ahjo.Vulkan.Vma.Native.Tests.csproj -c Release --nologo -l "console;verbosity=detailed"
