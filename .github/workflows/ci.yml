name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 for JavaScript actions now so we don't inherit the
# default flip scheduled for 2026-06-02. Remove once all pinned actions
# natively ship with a Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows runner stays compile-only / pure-CPU subset — no Vulkan
      # ICD provisioned (a SwiftShader build was tried but at 39+ min on
      # the hosted runner it's not viable; mock ICD wouldn't satisfy VMA).
      # Linux runner installs Mesa lavapipe, the Mesa software Vulkan ICD,
      # so the driver-gated test subset runs there. The earlier
      # vmaCreateAllocator-on-lavapipe SIGSEGV was a wrapper bug — the
      # allocator passed vulkanApiVersion=1.4 to a 1.3 device, causing VMA
      # to import 1.4 entry points the loader returned null for; fixed in
      # Allocator.Create by clamping to the device's reported apiVersion.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Cache the downloaded Vulkan-Headers archive so subsequent runs
      # don't hit GitHub. Invalidates when Directory.Build.props changes —
      # where VulkanHeadersVersion lives.
      - name: Cache Vulkan-Headers
        uses: actions/cache@v4
        with:
          path: native/downloaded
          key: vulkan-headers-${{ matrix.os }}-${{ hashFiles('Directory.Build.props') }}

      - name: Install Mesa lavapipe (Linux software Vulkan ICD)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          # Sanity-check the ICD is discoverable before tests run.
          vulkaninfo --summary | head -40 || true

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build Ahjo.Vulkan.slnx -c Release --nologo

      - name: Test — Ahjo.Vulkan.Native.Tests
        run: dotnet test tests/Ahjo.Vulkan.Native.Tests/Ahjo.Vulkan.Native.Tests.csproj -c Release --no-build --nologo

      - name: Test — Ahjo.Vulkan.Tests
        run: dotnet test tests/Ahjo.Vulkan.Tests/Ahjo.Vulkan.Tests.csproj -c Release --no-build --nologo
