name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 for JavaScript actions now so we don't inherit the
# default flip scheduled for 2026-06-02. Remove once all pinned actions
# natively ship with a Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # SwiftShader software Vulkan ICD packaged by Silk.NET (Apache-2.0).
  # Hosted Windows runners ship no Vulkan loader / ICD, so the workflow
  # provisions both alongside the build. Linux CI is parked until a
  # self-hosted runner with real Vulkan drivers is available — issue 32
  # established that SwiftShader on Linux SIGSEGVs mid-suite across
  # every build + loader combination tested.
  SILK_VULKAN_SWIFTSHADER_VERSION: "2025.9.8"
  # Khronos Vulkan loader (vulkan-1.dll) packaged by Silk.NET. Provisioned
  # alongside the ICD; VK_DRIVER_FILES then routes the loader's driver
  # lookup exclusively at SwiftShader.
  SILK_VULKAN_LOADER_VERSION: "2025.9.12"

jobs:
  # AHJO_VULKAN_TIER is this lane's declaration of what Vulkan capability the
  # host provides; VulkanTierContractTests fails the run when the host is below
  # it. `none` is the honest description of this runner today: the SwiftShader
  # ICD is provisioned and wired, but it does not answer vkCreateInstance
  # (issue 152), so 225 driver-gated tests skip. Raising this to `software` is
  # what #152's fix will do — and the contract test is what will prove it.
  #
  # Lowering a declared tier to make a lane green is prohibited: see
  # docs/ci-coverage.md and .github/CLAUDE.md. The single-entry matrix exists
  # only so the tier can reach the job name — `env` is not a valid context in
  # `jobs.<id>.name`, `matrix` is — which puts the coverage ceiling in the
  # checks list instead of in the logs.
  build-test:
    name: Build & Test (windows-latest, Vulkan ${{ matrix.vulkan-tier }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - vulkan-tier: none
    env:
      AHJO_VULKAN_TIER: ${{ matrix.vulkan-tier }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Cache the downloaded Vulkan-Headers archive so subsequent runs
      # don't hit GitHub. Invalidates when Directory.Build.props changes —
      # where VulkanHeadersVersion lives.
      - name: Cache Vulkan-Headers
        uses: actions/cache@v4
        with:
          path: native/downloaded
          key: vulkan-headers-windows-latest-${{ hashFiles('Directory.Build.props') }}

      # ── Vulkan loader + SwiftShader ICD ──────────────────────────────
      # Cache hit skips two ~15 MB nupkg downloads. Cache key invalidates
      # whenever either pinned version env var changes.
      - name: Cache Vulkan ICD bundle
        id: cache-vk
        uses: actions/cache@v4
        with:
          path: build/vulkan/win-x64
          key: vk-win-x64-loader${{ env.SILK_VULKAN_LOADER_VERSION }}-sws${{ env.SILK_VULKAN_SWIFTSHADER_VERSION }}

      - name: Provision Khronos loader + SwiftShader ICD
        if: steps.cache-vk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dst = "build/vulkan/win-x64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # .nupkg files are zips; rename to .zip so Expand-Archive
          # accepts them without extension-sniffing complaints.
          $loaderZip = Join-Path $env:RUNNER_TEMP "vk-loader.zip"
          $swsZip    = Join-Path $env:RUNNER_TEMP "vk-sws.zip"
          $loaderUnp = Join-Path $env:RUNNER_TEMP "vk-loader"
          $swsUnp    = Join-Path $env:RUNNER_TEMP "vk-sws"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.nuget.org/api/v2/package/Silk.NET.Vulkan.Loader.Native/${{ env.SILK_VULKAN_LOADER_VERSION }}" `
            -OutFile $loaderZip
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.nuget.org/api/v2/package/Silk.NET.Vulkan.SwiftShader.Native/${{ env.SILK_VULKAN_SWIFTSHADER_VERSION }}" `
            -OutFile $swsZip
          if (Test-Path $loaderUnp) { Remove-Item -Recurse -Force $loaderUnp }
          if (Test-Path $swsUnp)    { Remove-Item -Recurse -Force $swsUnp }
          Expand-Archive -Path $loaderZip -DestinationPath $loaderUnp -Force
          Expand-Archive -Path $swsZip    -DestinationPath $swsUnp    -Force
          Copy-Item -Path "$loaderUnp/runtimes/win-x64/native/*" -Destination $dst -Force
          Copy-Item -Path "$swsUnp/runtimes/win-x64/native/*"    -Destination $dst -Force
          Get-ChildItem $dst | ForEach-Object { Write-Host ("  {0,12}  {1}" -f $_.Length, $_.Name) }

      - name: Configure Vulkan environment
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "build/vulkan/win-x64"
          $icd = Join-Path $dir "vk_swiftshader_icd.json"
          # Necessary, not sufficient: a present manifest is not proof the ICD
          # answers vkCreateInstance — it is present on this runner today and
          # the ICD still never answers (issue 152). The capability check is
          # VulkanTierContractTests against AHJO_VULKAN_TIER; this throw only
          # catches a provisioning step that produced nothing at all.
          if (-not (Test-Path $icd)) { throw "SwiftShader ICD manifest missing: $icd" }
          # VK_DRIVER_FILES (loader 1.3.207+) overrides system ICD
          # discovery and routes exclusively at SwiftShader.
          "VK_DRIVER_FILES=$icd" >> $env:GITHUB_ENV
          # Prepend so LoadLibrary("vulkan-1.dll") finds the Silk.NET
          # loader before anything system-wide.
          "PATH=$dir;$env:PATH" >> $env:GITHUB_ENV

      # ── /Vulkan loader + SwiftShader ICD ─────────────────────────────

      - name: Restore dotnet tools
        run: dotnet tool restore

      # Unlike libktx, the Slang binary IS loaded by this job:
      # Ahjo.Vulkan.Slang.Tests is wrapper coverage and belongs here, not in
      # the slang-native lane, which is a build-artifact check and must not
      # grow into wrapper coverage (.github/CLAUDE.md). So the ~77 MB release
      # archive is fetched here too — but keyed on exactly what determines its
      # content, so it is downloaded once per pin and restored thereafter.
      # Same path and key shape as build-slang-native.yml's cache.
      - name: Cache staged Slang binaries
        uses: actions/cache@v4
        with:
          path: native/slang/staged/win-x64
          key: slang-win-x64-${{ hashFiles('Directory.Build.props', 'src/Ahjo.Vulkan.Slang.Native/Ahjo.Vulkan.Slang.Native.csproj', '.github/workflows/build-slang-native.yml') }}

      # SkipKtxNativeBuild keeps libktx's cmake build off this job's
      # critical path — it is built, cached, smoke-tested and shipped per
      # RID by the ktx-native workflow, which is also what proves it.
      # Building it here too would add a ~170 MB clone and a C++ build to
      # every Windows run to produce a binary this job never loads.
      # SkipNgxNativeBuild is here for the same reason as SkipKtxNativeBuild:
      # the shim is built, smoke-tested and shipped per RID by the ngx-native
      # workflow, which is also what proves it. This job never loads it — and
      # unlike libktx it would not even be built here anyway, because nothing
      # stages the NGX SDK on this lane, so the flag mostly documents the
      # intent and keeps the "not staged" message off this job's log.
      - name: Build (Release)
        run: dotnet build Ahjo.Vulkan.slnx -c Release --nologo -p:SkipKtxNativeBuild=true -p:SkipNgxNativeBuild=true

      - name: Test — Ahjo.Vulkan.Native.Tests
        run: dotnet test tests/Ahjo.Vulkan.Native.Tests/Ahjo.Vulkan.Native.Tests.csproj -c Release --no-build --nologo -l "console;verbosity=detailed"

      # Detailed console logging prints each test name as it starts so a
      # native crash (SIGSEGV/AV) names the offending test in the log
      # instead of just surfacing as exit 139 with no context. --blame
      # also writes Sequence.xml naming the test that was running when
      # the test host crashed — printed below on step failure.
      - name: Test — Ahjo.Vulkan.Tests
        id: wrapper-tests
        run: dotnet test tests/Ahjo.Vulkan.Tests/Ahjo.Vulkan.Tests.csproj -c Release --no-build --nologo -l "console;verbosity=detailed" --logger "trx;LogFileName=wrapper.trx" --blame --blame-crash --results-directory TestResults

      # Slang wrapper coverage. Compiling shader text to bytes needs no ICD,
      # so all but one test here runs regardless of what the SwiftShader
      # provisioning above managed; the one that feeds Slang's SPIR-V to
      # Device.CreateShaderModule gates on TestGate.RequireDriver like every
      # other device-dependent test.
      - name: Test — Ahjo.Vulkan.Slang.Tests
        run: dotnet test tests/Ahjo.Vulkan.Slang.Tests/Ahjo.Vulkan.Slang.Tests.csproj -c Release --no-build --nologo -l "console;verbosity=detailed"

      # Turns the run's skips into the headline verdict instead of a number
      # nobody reads out of the log (issue 158). Two conditions fail this step:
      #
      #  1. Any skip with no [gate:*] class. This is the load-bearing check —
      #     it is what stops the classification rotting, because the next
      #     ad-hoc Assert.Skip("...") cannot slip back into invisibility.
      #     Route new gates through Ahjo.Vulkan.Testing.TestGate.
      #  2. A gap class with a non-zero count at or below the declared tier.
      #     VulkanTierContractTests should already have failed in that case, so
      #     it means a tier-aware gate is miswired.
      #
      # Runs even when the test step failed, so a red run still gets its
      # coverage verdict; the test step's own result stands on its own and this
      # step never masks it. Skipped only when the tests never ran at all (a
      # broken build), where demanding a trx would just add noise to the real
      # failure.
      - name: Vulkan coverage summary
        if: always() && steps.wrapper-tests.conclusion != 'skipped'
        shell: pwsh
        run: |
          $declared = if ([string]::IsNullOrWhiteSpace($env:AHJO_VULKAN_TIER)) { "none" } else { $env:AHJO_VULKAN_TIER.Trim().ToLowerInvariant() }
          $rank = @{ none = 0; software = 1; hardware = 2; validation = 3 }
          if (-not $rank.ContainsKey($declared)) {
            Write-Output "::error::AHJO_VULKAN_TIER='$declared' is not a recognized tier. Expected one of: none, software, hardware, validation."
            exit 1
          }
          $declaredRank = $rank[$declared]

          $trx = "TestResults/wrapper.trx"
          if (-not (Test-Path $trx)) {
            Write-Output "::error::$trx was not produced, so this run's Vulkan coverage cannot be verified. The trx logger on the 'Test — Ahjo.Vulkan.Tests' step is what the coverage summary reads."
            exit 1
          }

          $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
          $results = @(Select-Xml -Path $trx -XPath "//t:UnitTestResult" -Namespace $ns | ForEach-Object { $_.Node })

          $total    = $results.Count
          $skipped  = @($results | Where-Object { $_.outcome -eq "NotExecuted" })
          $failed   = @($results | Where-Object { $_.outcome -eq "Failed" })
          $executed = $total - $skipped.Count

          # Gap classes need a tier to be provable; platform/feature are correct
          # and permanent wherever they fire.
          $needs = [ordered]@{ driver = 1; hardware = 2; validation = 3; spirv = -1; platform = -1; feature = -1 }
          $counts = [ordered]@{}
          foreach ($c in $needs.Keys) { $counts[$c] = 0 }
          $unclassified = @()

          foreach ($r in $skipped) {
            $message = [string]$r.Output.ErrorInfo.Message
            $m = [regex]::Match($message, '^\[gate:([a-z]+)\]')
            if ($m.Success -and $counts.Contains($m.Groups[1].Value)) {
              $counts[$m.Groups[1].Value] += 1
            } else {
              $unclassified += [pscustomobject]@{ Name = $r.testName; Reason = $message }
            }
          }

          $gap = $counts["driver"] + $counts["hardware"] + $counts["validation"] + $counts["spirv"]

          $meaning = @{}
          foreach ($c in $needs.Keys) {
            $meaning[$c] = switch ($c) {
              "spirv"    { "NOT PROVEN — glslc absent (follow-up)" }
              "platform" { "expected and permanent on this OS" }
              "feature"  { "device does not advertise the feature" }
              default    {
                if ($declaredRank -lt $needs[$c]) { "NOT PROVEN — needs tier ``$(($rank.GetEnumerator() | Where-Object { $_.Value -eq $needs[$c] }).Key)``" }
                elseif ($counts[$c] -gt 0) { "MISWIRED — tier ``$declared`` declares this present" }
                else { "covered — tier ``$declared`` declares this present" }
              }
            }
          }

          $md = @()
          $md += "## Vulkan test coverage — windows-latest"
          $md += ""
          $md += "| | |"
          $md += "|---|---|"
          $md += "| Declared tier | ``$declared`` |"
          $md += "| Tests total | $total |"
          $md += "| Executed | $executed |"
          $md += "| Skipped | $($skipped.Count) |"
          $md += "| Failed | $($failed.Count) |"
          $md += ""
          $md += "### Skips by class"
          $md += "| Class | Count | Meaning at declared tier ``$declared`` |"
          $md += "|---|---|---|"
          foreach ($c in $needs.Keys) { $md += "| ``$c`` | $($counts[$c]) | $($meaning[$c]) |" }
          $md += ""
          if ($gap -eq 0) {
            $md += "**Every gated test executed.** No coverage gap at or below tier ``$declared``."
          } elseif ($declaredRank -eq 0) {
            $md += "**$gap of $total wrapper tests did not execute.** Tier ``none`` is declared, so this run proves nothing about GPU behaviour. See docs/ci-coverage.md."
          } else {
            $md += "**$gap of $total wrapper tests did not execute.** Tier ``$declared`` is declared and enforced, so what did execute really ran against that capability; the rest needs a higher tier. See docs/ci-coverage.md."
          }
          if ($unclassified.Count -gt 0) {
            $md += ""
            $md += "**$($unclassified.Count) skipped tests carry no ``[gate:*]`` class — this step failed.**"
          }
          $md += ""
          if ($env:GITHUB_STEP_SUMMARY) { $md -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          $md -join "`n" | Write-Output

          $bad = $false
          if ($unclassified.Count -gt 0) {
            $list = ($unclassified | ForEach-Object { "$($_.Name) — `"$($_.Reason)`"" }) -join "; "
            Write-Output "::error::$($unclassified.Count) skipped tests carry no [gate:*] class. Every skip must go through Ahjo.Vulkan.Testing.TestGate so the coverage summary can tell a permanent platform skip from a coverage gap. Unclassified: $list"
            $bad = $true
          }
          foreach ($c in @("driver", "hardware", "validation")) {
            if ($counts[$c] -gt 0 -and $declaredRank -ge $needs[$c]) {
              Write-Output "::error::gate class '$c' skipped $($counts[$c]) tests, but AHJO_VULKAN_TIER=$declared declares that capability present. A tier-aware gate is miswired."
              $bad = $true
            }
          }
          if ($bad) { exit 1 }

      - name: Print blame logs on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::Blame Sequence files"
          find TestResults -type f \( -name 'Sequence_*.xml' -o -name '*.txt' -o -name '*.dmp.txt' \) -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"

      # Issue 28 — Native AOT smoke. Publishing under PublishAot=true is the
      # load-bearing check and the only one that runs on this lane: trim
      # warnings + ILC errors fail the build, so any reflection /
      # dynamic-codegen creep in the wrapper is caught here.
      #
      # The published exe does NOT currently execute the render→PNG round-trip
      # on this runner. It probes for an ICD, finds none (issue 152), prints
      # "No Vulkan driver detected; AOT publish verified, skipping smoke run."
      # and exits 0 — so the publish above, not the run below, is what this lane
      # proves today. The round-trip runs as soon as an ICD answers; and once
      # this lane declares AHJO_VULKAN_TIER `software` or above, a driverless
      # probe stops exiting 0 and fails the step with exit 4 instead. See
      # samples/AotSmoke/Program.cs.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: AOT publish — AotSmoke
        run: dotnet publish samples/AotSmoke/AotSmoke.csproj -c Release -r win-x64 --nologo -p:IlcUseEnvironmentalTools=true

      - name: AOT smoke run
        shell: pwsh
        run: |
          $exe = "samples/AotSmoke/bin/x64/Release/net10.0/win-x64/publish/AotSmoke.exe"
          if (-not (Test-Path $exe)) { throw "AOT smoke binary missing: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "AOT smoke exited with code $LASTEXITCODE" }

  # Issue #144 — Ahjo.Vulkan.Vma.Native ships Linux libvma.so binaries that no
  # lane ever executed, so a Release build silently producing a library that
  # SIGSEGVs on the first vmaCreateAllocator reached NuGet as 0.2.0 and broke
  # a downstream consumer. This lane compiles the .so from source on Linux and
  # runs a real allocator + buffer allocation against Mesa's lavapipe.
  #
  # Both Linux RIDs run: the #144 branch (VMA's aligned_alloc stub) is selected
  # by glibc's _GLIBCXX_HAVE_ALIGNED_ALLOC, which is defined on x64 and arm64
  # alike, so arm64 shipped the same fatal binary and deserves the same proof
  # rather than an inference from the x64 result.
  #
  # Deliberately narrow, and NOT a revival of the Linux test matrix: issue 32
  # parked that because software rasterizers SIGSEGV mid-suite on the
  # rendering paths (vkQueueSubmit2, image views). Allocation-only work is
  # both what lavapipe handles reliably and what actually broke here, so this
  # runs Ahjo.Vulkan.Vma.Native.Tests and nothing else. It is a build-artifact
  # check, not driver-gated wrapper coverage — the honesty argument that
  # closed issue 32 still stands for everything else.
  vma-linux:
    name: VMA native smoke (${{ matrix.rid }}, lavapipe, Vulkan software)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Don't let one arch's failure hide the other's result — the whole point
      # is knowing which RIDs are actually proven.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
          - rid: linux-arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Mirrors the Windows job's header cache. Covers both the Vulkan-Headers
      # archive and the VMA tarball the cmake build compiles against; both
      # versions are pinned in Directory.Build.props, so that's the key.
      - name: Cache Vulkan + VMA headers
        uses: actions/cache@v4
        with:
          path: |
            native/downloaded
            native/vma/downloaded
          key: vk-vma-headers-${{ matrix.rid }}-${{ hashFiles('Directory.Build.props') }}

      # mesa-vulkan-drivers carries lavapipe (llvmpipe), the CPU ICD; libvulkan1
      # is the Khronos loader. Both come from the distro, so unlike the Windows
      # job there's no nupkg to unpack. Resolve the manifest by glob rather than
      # hardcoding — Debian arch-qualifies the filename (lvp_icd.x86_64.json).
      - name: Provision Mesa lavapipe ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using ICD: $icd"
          # VK_DRIVER_FILES (loader 1.3.207+) pins driver discovery to lavapipe
          # so the lane can't quietly pick up some other ICD on the image.
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      # AHJO_VULKAN_TIER=software declares that lavapipe answers here, and
      # VulkanTierContractTests fails the lane when it does not. Without that
      # declaration a broken ICD install would report green while executing none
      # of the native code this lane exists to exercise — the exact
      # silent-coverage failure that let #144 ship. This replaces
      # AHJO_REQUIRE_VULKAN_DEVICE, which is now a hard error if still set
      # anywhere (issue 158); `software` is the right rung because lavapipe is a
      # CPU ICD and this lane only ever does allocation work.
      - name: Test — Ahjo.Vulkan.Vma.Native.Tests
        env:
          AHJO_VULKAN_TIER: "software"
        run: dotnet test tests/Ahjo.Vulkan.Vma.Native.Tests/Ahjo.Vulkan.Vma.Native.Tests.csproj -c Release --nologo -l "console;verbosity=detailed"

  # Ahjo.Vulkan.Ktx.Native ships a native binary per RID, and the same
  # reasoning that produced the vma-linux lane applies with less nuance:
  # the only honest proof that a shipped .dll/.so works is loading it and
  # transcoding a real KTX2 payload with it. Unlike VMA this needs no
  # driver at all — libktx is built with both uploaders off — so the lane
  # is a plain build-and-run on each RID rather than a rasterizer setup.
  #
  # The definition lives in build-ktx-native.yml because publish.yml calls
  # the same workflow for its artifacts: one place decides how the binary
  # is built, and CI and the release path cannot disagree about it.
  ktx-native:
    name: KTX native
    uses: ./.github/workflows/build-ktx-native.yml

  # Ahjo.Vulkan.Slang.Native ships a native binary per RID for the same
  # reason, with one difference: nothing is built from source. The binary is
  # upstream's own release artifact, pinned by tag AND by SHA-256, so what
  # this lane proves is not "we can compile it" but "this exact archive
  # contains a library that loads on this RID and compiles a shader with it".
  # A checksum tells you the bytes did not change; only running them tells
  # you they work.
  #
  # Like ktx-native it provisions no Vulkan loader and no ICD, on purpose:
  # Slang produces bytes and the package does not even reference
  # Ahjo.Vulkan.Native.
  #
  # The definition lives in build-slang-native.yml because publish.yml calls
  # the same workflow for its artifacts: one place decides how the binary
  # is staged, and CI and the release path cannot disagree about it.
  slang-native:
    name: Slang native
    uses: ./.github/workflows/build-slang-native.yml

  # Ahjo.Vulkan.Ngx.Native ships a native binary per RID that WE compile —
  # unlike every other native package here, where the binary is upstream's or
  # upstream's own build system produces it. NVIDIA distributes NGX as a static
  # client library with no DLL, so native/ngx/src/ahjo_ngx.cpp links it into a
  # shared library exporting exactly 27 symbols. Something has to build and run
  # that on both RIDs before it reaches NuGet.
  #
  # What this lane proves: the shim compiles on MSVC and GCC, loads, resolves
  # all 27 exports against the two hand-maintained export lists, and agrees
  # with the C# bindings about every NGX struct layout down to individual field
  # offsets — which is the whole point of running it on both RIDs.
  #
  # What it does NOT prove: that DLSS runs. Evaluating a feature needs an
  # NVIDIA driver and the consumer-supplied feature DLL, and no hosted runner
  # has either. That gap is named in docs/ci-coverage.md rather than papered
  # over. It provisions no Vulkan loader and no ICD, on purpose: the shim links
  # no vulkan-1.
  #
  # The definition lives in build-ngx-native.yml because publish.yml calls the
  # same workflow for its artifacts: one place decides how the binary is built,
  # and CI and the release path cannot disagree about it.
  ngx-native:
    name: NGX native
    uses: ./.github/workflows/build-ngx-native.yml
