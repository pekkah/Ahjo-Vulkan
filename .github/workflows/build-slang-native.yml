name: Build Slang Native

# Per-RID staging of the pinned Slang release binaries, plus the smoke suite
# that executes them. Each job downloads the official release archive for one
# RID, verifies its SHA-256 against the value pinned in Directory.Build.props,
# extracts the shipped subset, runs Ahjo.Vulkan.Slang.Native.Tests against it,
# and uploads it as a workflow artifact named slang-native-<rid>. publish.yml
# downloads all of them and aggregates them into a single multi-RID nupkg.
#
# Staging and testing in the SAME job is deliberate, for the same reason
# build-ktx-native.yml does it: the artifact that reaches NuGet is then, by
# construction, a binary something has loaded and compiled a real shader with.
# VMA's issue #144 is the counterexample — a Linux .so packed by a job that
# only knew how to compile, which SIGSEGVed on its first real call.
#
# Unlike the ktx lane, nothing is built from source here. Slang's own build
# pulls LLVM and a full downstream-compiler tree, and the artifact we would
# produce is the one upstream already publishes and tests. What CI proves is
# therefore not "we can compile it" but "this exact archive, at this exact
# hash, contains a library that compiles a shader on this RID".
#
# Triggers:
#   - workflow_call: invoked by ci.yml (proof) and publish.yml (artifacts)
#   - workflow_dispatch: manual run to refresh artifacts during dev
#   - push to main, paths-filtered: restage whenever the pinned Slang version
#     or its checksums, the project, the tests, or this workflow changes.

on:
  workflow_call: {}
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'src/Ahjo.Vulkan.Slang.Native/**'
      - 'tests/Ahjo.Vulkan.Slang.Native.Tests/**'
      - 'Directory.Build.props'
      - '.github/workflows/build-slang-native.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Stage + smoke slang (${{ matrix.rid }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Don't let one RID's failure hide the other's result — the whole
      # point is knowing which RIDs are actually proven.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
          - rid: linux-x64
            runs-on: ubuntu-latest
          # arm64 and macOS are deliberately absent even though upstream
          # publishes windows-aarch64, linux-aarch64, macos-x86_64 and
          # macos-aarch64 assets at every tag. A RID without a lane that
          # loads the binary and compiles a shader is a RID nobody has
          # proven. Add the lane first, then the RID — here, in the csproj's
          # _SlangRid/_SlangPackFile lists, and in the package README's
          # support table.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The staged directory IS the cache: every fetch target is conditioned
      # on the primary file's absence, so a hit skips the ~77 MB download and
      # the extraction entirely. Keyed on every input that can change the
      # output — the pinned SlangVersion and both archive checksums (all in
      # Directory.Build.props) and the project that drives the staging.
      #
      # The smoke tests run on a hit as well as a miss. A cached binary that
      # no longer loads is exactly the thing worth finding out about.
      - name: Cache staged Slang binaries
        id: cache-slang
        uses: actions/cache@v4
        with:
          path: native/slang/staged/${{ matrix.rid }}
          key: slang-${{ matrix.rid }}-${{ hashFiles('Directory.Build.props', 'src/Ahjo.Vulkan.Slang.Native/Ahjo.Vulkan.Slang.Native.csproj', '.github/workflows/build-slang-native.yml') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Builds the managed bindings and, on a cache miss, downloads the pinned
      # release archive and verifies its SHA-256 before extracting anything.
      # The hashes live in Directory.Build.props rather than in this file
      # precisely so a developer's local binary and the one that ships cannot
      # come from different bytes.
      - name: Stage Slang native + build bindings
        run: dotnet build src/Ahjo.Vulkan.Slang.Native/Ahjo.Vulkan.Slang.Native.csproj -c Release --nologo

      - name: List staged output
        shell: bash
        run: ls -la native/slang/staged/${{ matrix.rid }} || true

      # No Vulkan provisioning, deliberately: Slang compiles shader text to
      # SPIR-V bytes and has no Vulkan surface at all — the package does not
      # even reference Ahjo.Vulkan.Native. This lane needs no ICD, no loader
      # and no device. If it ever starts needing one, something has been
      # linked in that the package's contract says is not there.
      #
      # AHJO_VULKAN_TIER stays unset (i.e. `none`) for the same reason: the
      # lane touches no Vulkan surface, so it has nothing to declare.
      - name: Test — Ahjo.Vulkan.Slang.Native.Tests
        run: dotnet test tests/Ahjo.Vulkan.Slang.Native.Tests/Ahjo.Vulkan.Slang.Native.Tests.csproj -c Release --nologo -l "console;verbosity=detailed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slang-native-${{ matrix.rid }}
          path: native/slang/staged/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
